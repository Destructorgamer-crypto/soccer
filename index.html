<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>CHUTE</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none;touch-action:none;
    font-family:ui-monospace,Menlo,Consolas,monospace;color:#fff;user-select:none;-webkit-user-select:none}
  canvas{display:block}
  #goles{position:fixed;top:18px;left:22px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;opacity:.6}
  #goles b{display:block;margin-top:4px;font-size:22px;font-weight:300}
  #hint{position:fixed;left:0;right:0;bottom:16px;text-align:center;font-size:10px;
    letter-spacing:.25em;text-transform:uppercase;opacity:.3}
</style>
</head>
<body>
<div id="goles">Goles<b id="g">0</b></div>
<div id="hint">ratón = mover la bota · mantén clic = levantar el balón · R = reiniciar</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
'use strict';

/* ===== AJUSTES ===== */
const GW=9, GH=3, GZ=-20, GD=2.5, BR=0.22;   // portería (ancho, alto, posición, fondo) y radio del balón
const GRAV=15, DRAG=0.1, BOUNCE=0.6, ROLL=0.6;
const BOOT_K=14, BOOT_V=26, MAXV=42;         // reactividad y velocidad máx. de la bota / balón
const KICK_E=0.5;                            // rebote del chute
const LIFT=0.12, LIFT_UP=0.6;                // elevación normal y con clic mantenido
const SONIDO=true;

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ===== ESCENA ===== */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x000000);
scene.fog=new THREE.Fog(0x000000,25,80);

// Primera persona: tú estás en (0, 1.7, 5) mirando hacia la portería
const CAM_Z=5;
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.05,200);
camera.position.set(0,1.7,CAM_Z);
camera.rotation.x=-0.35;

scene.add(new THREE.AmbientLight(0xffffff,0.65));
const sun=new THREE.DirectionalLight(0xffffff,0.8);
sun.position.set(4,10,6); scene.add(sun);

// Suelo + cuadrícula
const ground=new THREE.Mesh(new THREE.PlaneGeometry(400,400),new THREE.MeshBasicMaterial({color:0x1a1a1a}));
ground.rotation.x=-Math.PI/2; scene.add(ground);
const grid=new THREE.GridHelper(200,200,0x363636,0x282828);
grid.position.y=0.005; scene.add(grid);

// Marcas blancas
const lineMat=new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.55});
function poly(pts,close){
  const g=new THREE.BufferGeometry().setFromPoints(pts.map(p=>new THREE.Vector3(p[0],0.02,p[1])));
  scene.add(close?new THREE.LineLoop(g,lineMat):new THREE.Line(g,lineMat));
}
poly([[-16,GZ],[16,GZ]]);
poly([[-7,GZ],[-7,GZ+4],[7,GZ+4],[7,GZ]]);
const ring=[]; for(let i=0;i<40;i++){const a=i/40*Math.PI*2;ring.push([Math.cos(a)*0.5,Math.sin(a)*0.5]);}
poly(ring,true);

/* ===== PORTERÍA ===== */
const frameMat=new THREE.MeshStandardMaterial({color:0xffffff,emissive:0x777777,roughness:.4});
function bar(r,h,x,y,z,rz){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,12),frameMat);
  m.position.set(x,y,z); m.rotation.z=rz||0; scene.add(m);
}
bar(0.08,GH,-GW/2,GH/2,GZ); bar(0.08,GH,GW/2,GH/2,GZ);
bar(0.08,GW+0.16,0,GH,GZ,Math.PI/2);

const netMat=new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.25});
function net(o,u,v,nu,nv){
  const pts=[], P=(i,j)=>new THREE.Vector3(
    o[0]+u[0]*i/nu+v[0]*j/nv, o[1]+u[1]*i/nu+v[1]*j/nv, o[2]+u[2]*i/nu+v[2]*j/nv);
  for(let j=0;j<=nv;j++)for(let i=0;i<=nu;i++){
    if(i<nu)pts.push(P(i,j),P(i+1,j));
    if(j<nv)pts.push(P(i,j),P(i,j+1));
  }
  scene.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts),netMat));
}
net([-GW/2,0,GZ-GD],[GW,0,0],[0,GH,0],18,8);          // fondo
net([-GW/2,0,GZ],[0,0,-GD],[0,GH,0],5,8);             // lateral izq.
net([ GW/2,0,GZ],[0,0,-GD],[0,GH,0],5,8);             // lateral der.
net([-GW/2,GH,GZ],[GW,0,0],[0,0,-GD],18,5);           // techo

/* ===== BALÓN ===== */
const ballMesh=new THREE.Mesh(new THREE.IcosahedronGeometry(BR,1),
  new THREE.MeshStandardMaterial({color:0xffffff,roughness:.45,flatShading:true}));
ballMesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(ballMesh.geometry),
  new THREE.LineBasicMaterial({color:0x000000,transparent:true,opacity:.5})));
scene.add(ballMesh);
const ball={p:new THREE.Vector3(0,BR,0),v:new THREE.Vector3()};

// Sombra simple (para ver la altura del balón)
const sc=document.createElement('canvas'); sc.width=sc.height=64;
{const g=sc.getContext('2d'),gr=g.createRadialGradient(32,32,0,32,32,32);
 gr.addColorStop(0,'rgba(0,0,0,.9)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,64,64);}
const shadow=new THREE.Mesh(new THREE.PlaneGeometry(1,1),
  new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(sc),transparent:true,depthWrite:false}));
shadow.rotation.x=-Math.PI/2; shadow.position.y=0.03; scene.add(shadow);

/* ===== BOTA (pequeña, siempre mirando a la portería) ===== */
const bootG=new THREE.Group(); scene.add(bootG);
const mOr=new THREE.MeshStandardMaterial({color:0xff6a00,roughness:.5,emissive:0x2a1100});
const mWh=new THREE.MeshStandardMaterial({color:0xeeeeee,roughness:.6});
const mDk=new THREE.MeshStandardMaterial({color:0x1a1a1a,roughness:.8});
function part(geo,mat,x,y,z,sx,sy,sz){
  const m=new THREE.Mesh(geo,mat); m.position.set(x,y,z);
  if(sx)m.scale.set(sx,sy,sz); bootG.add(m); return m;
}
part(new THREE.BoxGeometry(0.15,0.04,0.4),mWh,0,0.02,-0.05);
part(new THREE.SphereGeometry(0.1,16,12),mOr,0,0.1,-0.14,1,0.8,1.5);
part(new THREE.BoxGeometry(0.14,0.12,0.14),mOr,0,0.1,0.08);
part(new THREE.CylinderGeometry(0.06,0.07,0.35,12),mDk,0,0.3,0.08);
const boot={x:0,z:CAM_Z-3,tx:0,tz:CAM_Z-3,vx:0,vz:0};
let bl=0; // 0..1 → punta levantada

/* ===== SONIDO ===== */
let AC;
function audioInit(){
  if(!SONIDO)return;
  try{ if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended')AC.resume(); }catch(e){}
}
function thump(p){
  if(!AC)return;
  const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.frequency.setValueAtTime(170,t); o.frequency.exponentialRampToValueAtTime(45,t+0.15);
  g.gain.setValueAtTime(0.15+0.5*p,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.17);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+0.2);
}

/* ===== ENTRADA ===== */
const mouse={x:0,y:-0.5,down:false,has:false};
function setPointer(e){mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight*2-1);mouse.has=true;}
addEventListener('pointermove',setPointer);
addEventListener('pointerdown',e=>{audioInit();setPointer(e);mouse.down=true;});
addEventListener('pointerup',()=>mouse.down=false);
addEventListener('blur',()=>mouse.down=false);
addEventListener('keydown',e=>{if(e.key==='r'||e.key==='R'){audioInit();resetBall();}});

const ray=new THREE.Raycaster(), plane=new THREE.Plane(new THREE.Vector3(0,1,0),0), hit=new THREE.Vector3();
function updateTarget(){
  if(!mouse.has)return;
  camera.updateMatrixWorld();
  ray.setFromCamera({x:mouse.x,y:mouse.y},camera);
  let tx,tz;
  if(ray.ray.intersectPlane(plane,hit)){tx=hit.x;tz=hit.z;}
  else{ // el cursor apunta al cielo: bota lo más lejos posible
    const d=ray.ray.direction, h=Math.hypot(d.x,d.z)||1;
    tx=camera.position.x+d.x/h*16; tz=camera.position.z+d.z/h*16;
  }
  boot.tx=clamp(tx,-10,10);
  boot.tz=clamp(tz,CAM_Z-16,CAM_Z-1.8);
}

/* ===== ESTADO ===== */
let goals=0, scored=false, inGoal=false, kickCD=0;
function resetBall(){
  ball.p.set(0,BR,0); ball.v.set(0,0,0); ballMesh.quaternion.identity();
  scored=false; inGoal=false;
}

/* ===== FÍSICA ===== */
function stepBall(h){
  const p=ball.p,v=ball.v;
  v.y-=GRAV*h; v.multiplyScalar(Math.exp(-DRAG*h));
  const pz=p.z;
  p.x+=v.x*h; p.y+=v.y*h; p.z+=v.z*h;

  if(p.y<BR){
    p.y=BR;
    if(v.y<-1.5){v.y=-v.y*BOUNCE;v.x*=0.96;v.z*=0.96;} else v.y=0;
  }
  if(p.y<=BR+0.001){
    const f=Math.exp(-ROLL*h); v.x*=f; v.z*=f;
    if(v.x*v.x+v.z*v.z<0.02){v.x=0;v.z=0;}
  }

  // palos
  if(p.y<GH) for(const sx of [-1,1]){
    const px=sx*GW/2; let dx=p.x-px,dz=p.z-GZ; const d=Math.hypot(dx,dz),R=BR+0.08;
    if(d<R&&d>1e-4){
      dx/=d;dz/=d; p.x=px+dx*R; p.z=GZ+dz*R;
      const vn=v.x*dx+v.z*dz;
      if(vn<0){v.x-=1.6*vn*dx;v.z-=1.6*vn*dz;}
    }
  }
  // larguero
  if(Math.abs(p.x)<GW/2+0.08){
    let dy=p.y-GH,dz=p.z-GZ; const d=Math.hypot(dy,dz),R=BR+0.08;
    if(d<R&&d>1e-4){
      dy/=d;dz/=d; p.y=GH+dy*R; p.z=GZ+dz*R;
      const vn=v.y*dy+v.z*dz;
      if(vn<0){v.y-=1.6*vn*dy;v.z-=1.6*vn*dz;}
    }
  }
  // gol
  if(!scored&&pz>=GZ&&p.z<GZ&&Math.abs(p.x)<GW/2-0.05&&p.y<GH-0.05){
    scored=true; inGoal=true; goals++;
    document.getElementById('g').textContent=goals;
  }
  // dentro de la red
  if(inGoal&&p.z<GZ){
    v.multiplyScalar(Math.exp(-1.2*h));
    const hw=GW/2-BR*0.9;
    if(p.x>hw){p.x=hw;v.x*=-0.3;} if(p.x<-hw){p.x=-hw;v.x*=-0.3;}
    if(p.y>GH-BR){p.y=GH-BR;v.y*=-0.3;}
    const zb=GZ-GD+BR; if(p.z<zb){p.z=zb;v.z*=-0.18;}
  }
}

function collide(bx,bz){
  const p=ball.p,v=ball.v;
  const spheres=[
    [bx, 0.14-0.1*bl, bz-0.16, 0.12],   // punta (baja al levantarla → el balón sube)
    [bx, 0.18,        bz+0.06, 0.13]    // tobillo
  ];
  for(const s of spheres){
    let dx=p.x-s[0],dy=p.y-s[1],dz=p.z-s[2];
    const d=Math.hypot(dx,dy,dz),R=s[3]+BR;
    if(d<R&&d>1e-5){
      dx/=d;dy/=d;dz/=d;
      p.x=s[0]+dx*R; p.y=Math.max(BR,s[1]+dy*R); p.z=s[2]+dz*R;
      const rv=(v.x-boot.vx)*dx+v.y*dy+(v.z-boot.vz)*dz;
      if(rv<0){
        const j=-(1+KICK_E)*rv;
        v.x+=dx*j; v.y+=dy*j; v.z+=dz*j;
        if(-rv>1.5&&kickCD<=0){
          kickCD=0.12;
          v.y+=Math.min(Math.hypot(boot.vx,boot.vz)*(LIFT+LIFT_UP*bl),14);
          thump(Math.min(-rv/25,1));
        }
      }
      const m=v.length(); if(m>MAXV)v.multiplyScalar(MAXV/m);
    }
  }
}

/* ===== BUCLE ===== */
let last=performance.now();
const _ax=new THREE.Vector3();

function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min((now-last)/1000,0.033); last=now; if(dt<=0)return;

  updateTarget();

  // la bota persigue al ratón con velocidad limitada
  const k=1-Math.exp(-BOOT_K*dt);
  let sx=(boot.tx-boot.x)*k, sz=(boot.tz-boot.z)*k;
  const sl=Math.hypot(sx,sz), maxS=BOOT_V*dt;
  if(sl>maxS){sx*=maxS/sl;sz*=maxS/sl;}
  boot.vx=sx/dt; boot.vz=sz/dt;
  const ox=boot.x,oz=boot.z;
  bl+=((mouse.down?1:0)-bl)*Math.min(1,dt*20);
  kickCD-=dt;

  const N=8;
  for(let i=1;i<=N;i++){
    stepBall(dt/N);
    collide(ox+sx*i/N,oz+sz*i/N);
  }
  boot.x=ox+sx; boot.z=oz+sz;

  // dibujar
  ballMesh.position.copy(ball.p);
  const hv=Math.hypot(ball.v.x,ball.v.z);
  if(hv>0.05){_ax.set(ball.v.z,0,-ball.v.x).normalize(); ballMesh.rotateOnWorldAxis(_ax,hv*dt/BR);}
  const sh=1/(1+ball.p.y*0.4);
  shadow.position.set(ball.p.x,0.03,ball.p.z); shadow.scale.set(1.3*sh,1.3*sh,1);
  shadow.material.opacity=Math.max(0.2,1-ball.p.y*0.15);

  bootG.position.set(boot.x,0,boot.z);
  bootG.rotation.set(bl*0.5,0,0);

  renderer.render(scene,camera);
}

function resize(){
  renderer.setSize(innerWidth,innerHeight);
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize',resize); resize();

resetBall();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
